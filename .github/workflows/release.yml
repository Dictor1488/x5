name: Build and Release INQ x5
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          $candidates = @('C:\Python27\python.exe', 'C:\tools\python2\python.exe', 'C:\ProgramData\chocolatey\bin\python2.exe')
          $py27 = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $py27) { throw 'Python 2.7 not found' }
          "PYTHON27=$py27" >> $env:GITHUB_ENV
      - name: Validate
        shell: pwsh
        run: |
          python -m json.tool build.json | Out-Null
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'OpenWG integration contract tests failed' }
          Get-Content resources/in/gui/gameface/mods/x5/X5Counter/X5Counter.js -Raw | node --input-type=module --check
          if ($LASTEXITCODE -ne 0) { throw 'GameFace JS syntax error' }
          node tests/drag.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GameFace drag regression failed' }
      - name: Build
        shell: pwsh
        run: |
          $version = (Get-Content build.json -Raw | ConvertFrom-Json).info.version
          python build.py --python27 "$env:PYTHON27" --version "$version"
          "MOD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: me.inq.x5.wotmod
          path: build/me.inq.x5.wotmod
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: INQ x5 v${{ env.MOD_VERSION }}
          prerelease: false
          make_latest: true
          body: |
            INQ x5 GameFace counter for World of Tanks.
            Garage document injection using OpenWG gf_mod_inject; Ctrl+drag.
            Requires OpenWG Gameface. Client-side compatibility remains unverified.
          files: build/me.inq.x5.wotmod
          fail_on_unmatched_files: true
